name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dentalimperador
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dentalimperador?schema=public

      - name: Run seed
        working-directory: backend
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dentalimperador?schema=public

      - name: Run smoke tests
        working-directory: backend
        run: npx jest --config ./test/jest-e2e.json --testPathPatterns smoke --forceExit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dentalimperador?schema=public
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}

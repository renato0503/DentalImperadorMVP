name: Deploy MVP to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug: list workspace
        run: |
          echo "Working directory: $(pwd)"
          echo "List root:" 
          ls -la
          echo "List mvp folder:" 
          ls -la mvp || true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./mvp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
